<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SKABIC — Rekap Keuangan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#182B33;
    --ink-soft:#5E6E76;
    --paper:#FFFFFF;
    --paper-alt:#F2F6F6;
    --paper-line:#E1E7E7;
    --card:#FFFFFF;
    --gold:#177B72;
    --gold-soft:#E4F3F1;
    --navy-deep:#0B2A45;
    --navy-deep-2:#0E4B47;
    --header-teal:#2C8377;
    --btn-teal-dark:#2C8377;
    --bg-outer:#EEF2F1;
    --danger:#B23A3A;
    --hotel:#2C5F8A;
    --hotel-bg:#E6EEF4;
    --kuliner:#B5622C;
    --kuliner-bg:#F7E7DC;
    --kesehatan:#2F7865;
    --kesehatan-bg:#E1EFEA;
    --farmasi:#6B4C7A;
    --farmasi-bg:#EAE2ED;
    --radius:14px;
    --shadow: 0 1px 2px rgba(11,42,69,0.05), 0 6px 20px rgba(11,42,69,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg-outer);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #root{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    position:relative;
    box-shadow: 0 0 40px rgba(11,42,69,0.08);
  }
  @media (min-width:520px){
    body{ background: var(--bg-outer); padding:24px 0; }
    #root{ min-height:calc(100vh - 48px); border-radius:22px; overflow:hidden; box-shadow: 0 0 50px rgba(11,42,69,0.10); }
  }

  /* ---------- Header ---------- */
  .topbar{
    background: var(--header-teal);
    color:#fff;
    padding:22px 20px 18px;
    position:relative;
  }
  .brand-text{ position:relative; z-index:1; }
  .brand-text h1{ font-family:'Manrope',sans-serif; font-weight:800; font-size:22px; margin:0; letter-spacing:0.4px; }
  .brand-text p{ margin:2px 0 0; font-size:12px; color:#DDEEEB; letter-spacing:0.3px; }
  .topbar-summary{
    position:relative; z-index:1;
    margin-top:16px;
    display:flex; gap:10px;
  }
  .sum-card{
    flex:1; background:rgba(255,255,255,0.14);
    border:1px solid rgba(255,255,255,0.22);
    border-radius:12px; padding:10px 12px;
  }
  .sum-card .lbl{ font-size:10.5px; color:#E4F3F0; text-transform:uppercase; letter-spacing:0.6px;}
  .sum-card .val{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:15px; margin-top:3px; color:#FFFFFF;}

  /* ---------- Top Tabs (nav) ---------- */
  .top-tabs{
    position:sticky; top:0; z-index:6;
    display:flex;
    background:#fff;
    border-bottom:1px solid var(--paper-line);
    padding:6px 8px;
    gap:4px;
    box-shadow:0 2px 8px rgba(11,42,69,0.05);
  }
  .nav-btn{
    flex:1; border:none; background:transparent; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:8px 4px 7px; border-radius:10px; color:var(--ink-soft);
    font-family:'Inter',sans-serif; font-size:11px; font-weight:600;
    transition: color .15s, background .15s;
  }
  .nav-btn svg{ width:20px; height:20px; }
  .nav-btn.active{ color:#fff; background:var(--btn-teal-dark); }
  .nav-btn.active svg{ stroke:#fff; }

  main{ flex:1; padding:16px 16px 26px; overflow-y:auto; }

  h2.section-title{
    font-family:'Manrope',sans-serif; font-weight:600; font-size:18px; margin:2px 0 3px;
  }
  p.section-sub{ font-size:12.5px; color:var(--ink-soft); margin:0 0 16px; }

  /* ---------- Cards / Forms ---------- */
  .card{
    background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:16px; margin-bottom:14px; border:1px solid rgba(11,42,69,0.04);
  }
  label.field-label{
    display:block; font-size:11.5px; font-weight:600; color:var(--ink-soft);
    text-transform:uppercase; letter-spacing:0.5px; margin:0 0 8px;
  }
  .jurusan-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:6px;}
  .jurusan-grid.has-error{ outline:1.5px dashed var(--danger); outline-offset:6px; border-radius:12px; }
  .field-error{ color:var(--danger); font-size:11.5px; font-weight:600; margin:0 0 14px; }
  input.has-error, select.has-error{ border-color:var(--danger) !important; background:#FBF0F0; }
  .jurusan-opt{
    border:1.5px solid var(--paper-line); border-radius:11px; padding:10px 10px;
    display:flex; align-items:center; gap:8px; cursor:pointer; background:#fff;
    transition: border-color .15s, background .15s, transform .1s;
  }
  .jurusan-opt:active{ transform:scale(0.98); }
  .jurusan-opt.selected{ border-color: var(--sel-color, var(--gold)); background: var(--sel-bg, var(--gold-soft)); }
  .j-badge{
    width:32px;height:32px;border-radius:50%; flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    color:#fff;
  }
  .j-badge svg{ width:17px; height:17px; }
  .j-name{ font-size:12.5px; font-weight:600; line-height:1.25; }

  input[type=date], input[type=month], input[type=text], input[type=number], input[type=password], select{
    width:100%; border:1.5px solid var(--paper-line); border-radius:10px;
    padding:11px 12px; font-size:14.5px; font-family:'IBM Plex Mono',monospace;
    background:#fff; color:var(--ink); outline:none;
  }
  input:focus, select:focus{ border-color:var(--header-teal); }
  .field{ margin-bottom:14px; }
  .rp-preview{ font-size:11.5px; color:var(--gold); margin-top:5px; font-weight:600; font-family:'IBM Plex Mono',monospace;}

  .potongan-box{
    background:var(--gold-soft); border-radius:9px; padding:9px 12px; margin-top:8px;
    display:flex; justify-content:space-between; align-items:center; gap:8px;
  }
  .potongan-box .p-lbl{ font-size:10.5px; font-weight:700; color:#0E4B47; text-transform:uppercase; letter-spacing:0.3px; }
  .potongan-box .p-val{ font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:12.5px; color:#0B3330; text-align:right; }

  .btn-primary{
    width:100%; border:none; border-radius:11px; padding:13px 16px;
    background: var(--btn-teal-dark);
    color:#fff; font-weight:700; font-size:14px; cursor:pointer;
    font-family:'Inter',sans-serif; letter-spacing:0.2px;
    box-shadow: 0 4px 12px rgba(10,45,41,0.28);
  }
  .btn-primary:active{ transform: translateY(1px); }
  .btn-secondary{
    width:100%; border:1.5px solid var(--btn-teal-dark); border-radius:11px; padding:11px 16px;
    background:#fff; color:var(--btn-teal-dark); font-weight:700; font-size:13.5px; cursor:pointer;
    font-family:'Inter',sans-serif; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn-secondary svg{ width:16px; height:16px; }
  .btn-small{
    border:1.5px solid var(--paper-line); border-radius:9px; padding:7px 12px;
    background:#fff; font-weight:700; font-size:11.5px; cursor:pointer; font-family:'Inter',sans-serif;
    display:inline-flex; align-items:center; gap:5px; color:var(--ink);
  }
  .btn-small svg{ width:13px;height:13px; }
  .btn-small.danger{ color:var(--danger); border-color:#EAD0D0; }
  .btn-small.teal{ color:var(--btn-teal-dark); border-color:var(--btn-teal-dark); background:var(--gold-soft); }

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(10px);
    background:var(--navy-deep); color:#fff; padding:10px 18px; border-radius:999px;
    font-size:13px; font-weight:600; box-shadow:0 8px 20px rgba(0,0,0,0.25);
    opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
    z-index:50; white-space:nowrap; max-width:88%; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  .staff-banner{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    background:var(--paper-alt); border:1px solid var(--paper-line); border-radius:11px;
    padding:10px 14px; margin-bottom:14px; font-size:12.5px;
  }
  .staff-banner b{ color:var(--btn-teal-dark); }

  /* ---------- Riwayat ---------- */
  .filter-row{ display:flex; gap:8px; margin-bottom:14px; }
  .filter-row select{ font-family:'Inter',sans-serif; font-weight:600; font-size:12.5px; padding:9px 10px;}

  .mode-tabs{
    display:flex; background:var(--paper-alt); border:1.5px solid var(--paper-line); border-radius:12px;
    padding:3px; margin-bottom:14px; gap:2px;
  }
  .mode-tab{
    flex:1; text-align:center; padding:10px 6px; border-radius:9px; border:none;
    font-size:12.5px; font-weight:700; color:var(--ink-soft); cursor:pointer;
    font-family:'Inter',sans-serif; background:transparent; transition: background .15s, color .15s;
  }
  .mode-tab.active{ background:var(--btn-teal-dark); color:#fff; }

  .date-group{ margin-bottom:14px; }
  .date-head{ padding:2px 2px 8px; }
  .date-head .d-label{ font-family:'Manrope',sans-serif; font-weight:600; font-size:14.5px;}
  .date-head .d-sub{ font-size:10.5px; color:var(--ink-soft); }
  .entry-row{
    display:flex; align-items:center; gap:10px; padding:10px 4px;
    border-bottom:1px dashed var(--paper-line);
  }
  .entry-row:last-child{ border-bottom:none; }
  .entry-info{ flex:1; min-width:0; }
  .entry-jname{ font-size:12.5px; font-weight:700; }
  .entry-figures{ font-family:'IBM Plex Mono',monospace; font-size:10.8px; color:var(--ink-soft); margin-top:2px; line-height:1.65;}
  .entry-figures b{ color:var(--ink); font-weight:600; }
  .entry-actions{ display:flex; gap:6px; flex-shrink:0; }
  .icon-btn{
    border:none; background:transparent; color:#C9CFD6; cursor:pointer; padding:6px;
    display:flex;
  }
  .icon-btn.edit:hover{ color:var(--btn-teal-dark); }
  .icon-btn.del:hover{ color:var(--danger); }
  .icon-btn svg{ width:16px;height:16px; }

  .day-total{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--gold-soft); border-radius:9px; padding:9px 12px; margin:10px 0 4px;
  }
  .day-total .t-lbl{ font-size:11px; font-weight:700; color:#0E4B47; text-transform:uppercase; letter-spacing:0.4px;}
  .day-total .t-val{ font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:12px; color:#0B3330;}

  .stamp{ width:104px;height:104px; margin:6px auto 4px; position:relative; }
  .stamp svg{ width:100%; height:100%; }

  .empty-state{ text-align:center; padding:40px 10px; color:var(--ink-soft); }
  .empty-state svg{ width:52px;height:52px; margin-bottom:10px; opacity:0.5;}
  .empty-state p{ font-size:13px; margin:0; }

  .range-row{ display:flex; gap:8px; align-items:flex-end; }
  .range-row .field{ flex:1; margin-bottom:0; }

  table.rekap-table{ width:100%; border-collapse:collapse; margin-top:6px; }
  table.rekap-table th{
    text-align:left; font-size:9.5px; text-transform:uppercase; letter-spacing:0.3px;
    color:var(--ink-soft); padding:6px 6px; border-bottom:1.5px solid var(--paper-line); white-space:nowrap;
  }
  table.rekap-table td{
    padding:8px 6px; font-size:11px; border-bottom:1px dashed var(--paper-line);
    font-family:'IBM Plex Mono',monospace; white-space:nowrap;
  }
  table.rekap-table td.jname{ font-family:'Inter',sans-serif; font-weight:700; font-size:12px; }
  table.rekap-table tr.total-row td{
    border-top:1.5px solid var(--ink); border-bottom:none; font-weight:700; padding-top:9px;
  }
  .chip{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; }
  .dot{ width:8px;height:8px;border-radius:50%; }
  .hint{ font-size:11px; color:var(--ink-soft); margin-top:6px; line-height:1.5;}

  /* ---------- Password / NIP login gate ---------- */
  .password-screen{ text-align:center; padding:30px 6px 10px; }
  .lock-badge{
    width:60px;height:60px;border-radius:50%; margin:0 auto 16px;
    background:var(--gold-soft); display:flex;align-items:center;justify-content:center;
    color:var(--btn-teal-dark);
  }
  .lock-badge svg{ width:26px;height:26px; }
  .password-screen h3{ font-family:'Manrope',sans-serif; font-weight:600; font-size:17px; margin:0 0 4px; }
  .password-screen p{ font-size:12.5px; color:var(--ink-soft); margin:0 0 18px; }

  /* ---------- Settings ---------- */
  .settings-section{ margin-bottom:20px; }
  .settings-section h4{ font-family:'Manrope',sans-serif; font-weight:600; font-size:14.5px; margin:0 0 10px; display:flex; align-items:center; gap:6px; }
  .settings-section h4 svg{ width:16px; height:16px; flex-shrink:0; color:var(--btn-teal-dark); }
  .logo-preview-wrap{ display:flex; flex-direction:column; align-items:center; gap:12px; padding:6px 0 4px; }
  .logo-preview-banner{
    width:100%; max-width:260px; height:80px; border-radius:12px; overflow:hidden;
    background: repeating-linear-gradient(45deg, #f4f2ea, #f4f2ea 8px, #ece8db 8px, #ece8db 16px);
    display:flex;align-items:center;justify-content:center; border:1.5px dashed var(--paper-line);
  }
  .logo-preview-banner img{ width:100%; height:100%; object-fit:contain; }
  .logo-preview-banner .ph{ font-family:'Manrope',sans-serif; font-weight:700; font-size:15px; color:var(--ink-soft); text-align:center; padding:0 10px; }
  .file-label{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    border:1.5px solid var(--btn-teal-dark); border-radius:11px; padding:11px 16px;
    background:#fff; color:var(--btn-teal-dark); font-weight:700; font-size:13.5px; cursor:pointer;
    font-family:'Inter',sans-serif; width:100%;
  }
  .file-label svg{ width:16px;height:16px; }
  .btn-danger-text{
    width:100%; border:none; background:transparent; color:var(--danger); font-weight:600;
    font-size:12.5px; padding:10px; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .inline-row{ display:flex; gap:8px; }
  .inline-row .field{ flex:1; margin-bottom:10px; }
  .divider{ height:1px; background:var(--paper-line); margin:16px 0; }
  .edit-form{ background:var(--paper-alt); border-radius:11px; padding:12px; margin:6px 0 12px; border:1.5px solid var(--paper-line); }
  .edit-form .field{ margin-bottom:10px; }
  .edit-actions{ display:flex; gap:8px; margin-top:4px; }
  .edit-actions .btn-primary, .edit-actions .btn-secondary{ padding:10px; font-size:12.5px; }

  .db-status{
    display:flex; align-items:center; gap:8px; padding:9px 12px; border-radius:9px;
    font-size:11.5px; font-weight:700; margin-bottom:14px;
  }
  .db-status.connected{ background:#E1EFEA; color:#1F5B47; }
  .db-status.disconnected{ background:#F1EDE2; color:#7A6A4A; }
  .db-status .dot2{ width:8px;height:8px;border-radius:50%; flex-shrink:0; }
  .db-status.connected .dot2{ background:#2F9165; }
  .db-status.disconnected .dot2{ background:#C99A46; }

  .percent-total-note{
    font-size:11.5px; font-weight:700; padding:8px 12px; border-radius:9px; margin:4px 0 12px;
  }
  .percent-total-note.ok{ background:#E1EFEA; color:#1F5B47; }
  .percent-total-note.warn{ background:#FBF0E0; color:#8A5A1E; }
</style>
</head>

function todayStr(){
  const d = new Date();
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off*60000);
  return local.toISOString().slice(0,10);
}
function currentMonthStr(){ return todayStr().slice(0,7); }
function formatRp(n){ n = Number(n)||0; return 'Rp ' + n.toLocaleString('id-ID'); }
/* ---- Input nominal uang: otomatis memberi tanda titik ribuan (1.500.000) ---- */
function onlyDigits(s){ return String(s==null?'':s).replace(/\D/g,'').replace(/^0+(?=\d)/,'').slice(0,15); }
function formatThousands(digits){ return onlyDigits(digits).replace(/\B(?=(\d{3})+(?!\d))/g, '.'); }
function bindMoneyInput(el, onValue){
  if(!el) return;
  el.addEventListener('input', ()=>{
    const raw = el.value;
    const caret = el.selectionStart != null ? el.selectionStart : raw.length;
    const digitsBeforeCaret = raw.slice(0, caret).replace(/\D/g,'').length;
    const digits = onlyDigits(raw);
    const formatted = formatThousands(digits);
    el.value = formatted;
    let pos = 0, count = 0;
    while(pos < formatted.length && count < digitsBeforeCaret){
      if(/\d/.test(formatted[pos])) count++;
      pos++;
    }
    try{ el.setSelectionRange(pos, pos); }catch(e){}
    onValue(digits);
  });
}
function formatTanggalPanjang(dstr){
  const d = new Date(dstr+'T00:00:00');
  return d.toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}
function formatTanggalPendek(dstr){
  const d = new Date(dstr+'T00:00:00');
  return d.toLocaleDateString('id-ID', { day:'2-digit', month:'short', year:'numeric' });
}
function formatBulanTahun(mstr){
  const d = new Date(mstr+'-01T00:00:00');
  return d.toLocaleDateString('id-ID', { month:'long', year:'numeric' });
}
function uid(){ return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function jurusanLabelFor(key){ return key==='semua' ? 'Semua Jurusan' : jMap[key].label; }

function computeBreakdown(untung){
  const out = {};
  KATEGORI_POTONGAN.forEach(k=>{
    const pct = state.percentages[k.key];
    out[k.key] = { percent: pct, nominal: Math.round(untung * pct/100) };
  });
  return out;
}
function entryFieldPercent(e, key){ const v = e[key+'Percent']; return v!=null ? v : state.percentages[key]; }
function entryFieldNominal(e, key){
  const v = e[key+'Nominal'];
  if(v!=null) return v;
  return Math.round(e.untung * entryFieldPercent(e,key)/100);
}

/* ============ SUPABASE CONNECTION ============ */
async function connectSupabase(url, key){
  if(!url || !key) return false;
  try{
    const { createClient } = window.supabase;
    const client = createClient(url, key);
    const { error } = await client.from('skabic_settings').select('id').limit(1);
    if(error) throw error;
    state.supabaseClient = client;
    state.supabaseConnected = true;
    return true;
  }catch(e){
    state.supabaseConnected = false;
    console.error('Gagal terhubung ke Supabase:', e);
    return false;
  }
}

function percentagesFromSettingsRow(row){
  const out = {};
  KATEGORI_POTONGAN.forEach(k=>{
    const col = 'percent_'+k.col;
    out[k.key] = row && row[col]!=null ? Number(row[col]) : k.def;
  });
  return out;
}

async function dbLoadEntriesFromSupabase(){
  try{
    const { data, error } = await state.supabaseClient
      .from('skabic_entries').select('*').order('tanggal', { ascending:false });
    if(error) throw error;
    state.entries = (data||[]).map(r=>{
      const obj = {
        id: r.id, jurusan: r.jurusan, tanggal: r.tanggal,
        kotor: Number(r.kotor), untung: Number(r.untung),
        nip: r.nip || null, namaPetugas: r.nama_petugas || null,
        createdAt: Number(r.created_at)
      };
      KATEGORI_POTONGAN.forEach(k=>{
        obj[k.key+'Percent'] = r[k.col+'_percent']!=null ? Number(r[k.col+'_percent']) : null;
        obj[k.key+'Nominal'] = r[k.col+'_nominal']!=null ? Number(r[k.col+'_nominal']) : null;
      });
      return obj;
    });
  }catch(e){
    showToast('Gagal memuat data dari Supabase');
    state.entries = [];
  }
}
async function dbLoadSettingsFromSupabase(){
  try{
    const { data, error } = await state.supabaseClient
      .from('skabic_settings').select('*').eq('id',1).maybeSingle();
    if(error) throw error;
    state.logo = data && data.logo ? data.logo : null;
    state.percentages = percentagesFromSettingsRow(data);
    state.password = data && data.password ? data.password : DEFAULT_PASSWORD;
  }catch(e){
    state.logo = null;
    state.percentages = Object.fromEntries(KATEGORI_POTONGAN.map(k=>[k.key, k.def]));
    state.password = DEFAULT_PASSWORD;
  }
}

async function dbInsertEntry(entry){
  if(state.supabaseConnected){
    try{
      const payload = {
        id: entry.id, jurusan: entry.jurusan, tanggal: entry.tanggal,
        kotor: entry.kotor, untung: entry.untung,
        nip: entry.nip, nama_petugas: entry.namaPetugas, created_at: entry.createdAt
      };
      KATEGORI_POTONGAN.forEach(k=>{
        payload[k.col+'_percent'] = entry[k.key+'Percent'];
        payload[k.col+'_nominal'] = entry[k.key+'Nominal'];

  }

async function dbSaveSettings(fields){
  if(state.supabaseConnected){
    try{
      const payload = { id:1 };
      if('logo' in fields) payload.logo = fields.logo;
      if('password' in fields) payload.password = fields.password;
      if('percentages' in fields){
        KATEGORI_POTONGAN.forEach(k=>{ payload['percent_'+k.col] = fields.percentages[k.key]; });
      }
      const { error } = await state.supabaseClient.from('skabic_settings').upsert(payload);
      if(error) throw error;
      return true;
    }catch(e){ showToast('Gagal menyimpan pengaturan ke Supabase'); return false; }
  }else{
    try{
      if('logo' in fields){
        if(fields.logo) await window.storage.set('skabic-logo', fields.logo, true);
        else await window.storage.delete('skabic-logo', true);
      }
      if('password' in fields) await window.storage.set('skabic-password', fields.password, true);
      if('percentages' in fields) await window.storage.set('skabic-percentages', JSON.stringify(fields.percentages), true);
      return true;

function resizeLogoBanner(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=>{
        const W = 480, H = 140;
        const canvas = document.createElement('canvas');
        canvas.width = W; canvas.height = H;
        const ctx = canvas.getContext('2d');
        const scale = Math.min(W/img.width, H/img.height);
        const w = img.width*scale, h = img.height*scale;
        const x = (W-w)/2, y = (H-h)/2;
        ctx.clearRect(0,0,W,H);
        ctx.drawImage(img, x, y, w, h);
        resolve(canvas.toDataURL('image/png'));
      };
      img.onerror = ()=> reject(new Error('Gambar tidak dapat dibaca'));
      img.src = ev.target.result;
    };
    reader.onerror = ()=> reject(new Error('File tidak dapat dibaca'));
    reader.readAsDataURL(file);
  });
}
async function handleLogoUpload(file){
  if(!file) return;
  if(!file.type.startsWith('image/')){ showToast('File harus berupa gambar'); return; }
  try{
    const dataUrl = await resizeLogoBanner(file);
    const ok = await saveLogo(dataUrl);
    if(ok){ state.logo = dataUrl; render(); showToast('Logo berhasil diperbarui'); }
  }catch(e){ showToast('Gagal memproses gambar'); }
}

function clearFieldErrorUI(field){
  const inputIdMap = { tanggal:'tanggal-input', kotor:'kotor-input', untung:'untung-input' };
  const inputId = inputIdMap[field];
  if(inputId){ const el = document.getElementById(inputId); if(el) el.classList.remove('has-error'); }
  const errEl = document.getElementById('error-'+field);
  if(errEl) errEl.remove();
}
function renderRpPreview(){
  const kEl = document.getElementById('kotor-preview');
  const uEl = document.getElementById('untung-preview');
  if(kEl) kEl.textContent = state.form.kotor ? formatRp(state.form.kotor) : '';
  if(uEl) uEl.textContent = state.form.untung ? formatRp(state.form.untung) : '';

  const untung = Number(state.form.untung)||0;
  const breakdown = computeBreakdown(untung);
  KATEGORI_POTONGAN.forEach(k=>{
    const valEl = document.getElementById('bd-val-'+k.key);
    const pctEl = document.getElementById('bd-pct-'+k.key);
    if(valEl) valEl.textContent = formatRp(breakdown[k.key].nominal);
    if(pctEl) pctEl.textContent = breakdown[k.key].percent + '%';
  });
}

async function submitEntry(){
  const f = state.form;
  const errors = {};
  if(!f.jurusan) errors.jurusan = 'Pilih salah satu jurusan terlebih dahulu.';
  if(!f.tanggal) errors.tanggal = 'Tanggal wajib diisi.';
  const kotor = Number(f.kotor);
  const untung = Number(f.untung);
  if(f.kotor === '' || isNaN(kotor) || kotor < 0) errors.kotor = 'Omzet wajib diisi dengan angka yang benar.';
  if(f.untung === '' || isNaN(untung) || untung < 0) errors.untung = 'Laba Bersih wajib diisi dengan angka yang benar.';

  if(Object.keys(errors).length > 0){
    state.formErrors = errors;
    render();
    showToast(errors.jurusan ? 'Pilih jurusan terlebih dahulu sebelum menyimpan' : 'Lengkapi semua isian sebelum menyimpan');
    return;
  }

  state.formErrors = {};
  const breakdown = computeBreakdown(untung);
  const newEntry = {
    id: uid(), jurusan: f.jurusan, tanggal: f.tanggal, kotor, untung,
    nip: state.loggedInStaff ? state.loggedInStaff.nip : null,
    namaPetugas: state.loggedInStaff ? state.loggedInStaff.nama : null,
    createdAt: Date.now()
  };
  KATEGORI_POTONGAN.forEach(k=>{
    newEntry[k.key+'Percent'] = breakdown[k.key].percent;
    newEntry[k.key+'Nominal'] = breakdown[k.key].nominal;
  });
  state.entries.push(newEntry);
  await dbInsertEntry(newEntry);
  showToast('Data berhasil disimpan');
  state.form = { jurusan:null, tanggal: f.tanggal, kotor:'', untung:'' };
  render();
}

    if(!state.dlTanggal){ showToast('Pilih tanggal terlebih dahulu'); return; }
    let filtered = state.entries.filter(e=>e.tanggal===state.dlTanggal);
    if(state.dlJurusan!=='semua') filtered = filtered.filter(e=>e.jurusan===state.dlJurusan);
    state.dlResult = { type:'harian', entries:filtered };
  }else{
    if(!state.dlBulan){ showToast('Pilih bulan terlebih dahulu'); return; }
    let filtered = state.entries.filter(e=> e.tanggal.slice(0,7)===state.dlBulan);
    if(state.dlJurusan!=='semua') filtered = filtered.filter(e=>e.jurusan===state.dlJurusan);
    state.dlResult = { type:'bulanan', entries:filtered };
  }
  render();
}

function startEditEntry(id){

  if(!e) return;
  state.adminEditId = id;
  state.adminEditForm = { jurusan:e.jurusan, tanggal:e.tanggal, kotor:String(Math.round(e.kotor)), untung:String(Math.round(e.untung)) };
  render();
}
function cancelEditEntry(){ state.adminEditId=null; state.adminEditForm=null; render(); }
function updateEditForm(field, val){ state.adminEditForm[field] = val; }
async function saveEditEntry(){
  const f = state.adminEditForm;
  if(!f.jurusan || !f.tanggal || f.kotor==='' || f.untung===''){ showToast('Lengkapi semua isian'); return; }
  const kotor = Number(f.kotor), untung = Number(f.untung);
  if(isNaN(kotor) || kotor<0 || isNaN(untung) || untung<0){ showToast('Nominal tidak valid'); return; }
  const idx = state.entries.findIndex(x=>x.id===state.adminEditId);
  if(idx===-1) return;
  const breakdown = computeBreakdown(untung);
  const updated = { ...state.entries[idx], jurusan:f.jurusan, tanggal:f.tanggal, kotor, untung };
  KATEGORI_POTONGAN.forEach(k=>{
    updated[k.key+'Percent'] = breakdown[k.key].percent;
    updated[k.key+'Nominal'] = breakdown[k.key].nominal;
  });
  state.entries[idx] = updated;
  await dbUpdateEntry(state.adminEditId, updated);
  state.adminEditId=null; state.adminEditForm=null;
  showToast('Data berhasil diperbarui');
  render();
}

/* ============ PDF GENERATION ============ */
function pdfHeader(doc, title, subtitle){
  const pageWidth = doc.internal.pageSize.getWidth();
  doc.setFillColor(11,42,69);
  doc.rect(0,0,pageWidth,26,'F');
  if(state.logo){
    try{ doc.addImage(state.logo, 'PNG', 12, 5, 62, 16); }catch(e){ /* ignore malformed image */ }
  }else{
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica','bold');
    doc.setFontSize(15);
    doc.text('SKABIC', 14, 13);
    doc.setFontSize(9);
    doc.setFont('helvetica','normal');
    doc.setTextColor(200,210,220);
    doc.text('Skanepa Business Center', 14, 19.5);
  }
  doc.setTextColor(30,30,30);
  doc.setFont('helvetica','bold');
  doc.setFontSize(12.5);
  doc.text(title, 14, 34);
  doc.setFont('helvetica','normal');
  doc.setFontSize(9.5);
  doc.setTextColor(90,90,90);
  doc.text(subtitle, 14, 40);
}
function pdfFooter(doc){
  const pageHeight = doc.internal.pageSize.getHeight();
  const pageCount = doc.internal.getNumberOfPages();
  for(let i=1;i<=pageCount;i++){
    doc.setPage(i);
    doc.setFontSize(8);
    doc.setTextColor(150,150,150);
    doc.text('Dicetak otomatis oleh Aplikasi Rekap Keuangan SKABIC — ' + new Date().toLocaleString('id-ID'), 14, pageHeight - 8);
  }
}

function generateHarianPDF(tanggal, jurusanKey, entries){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:'landscape' });
  pdfHeader(doc, 'Rekap Keuangan Harian', `${formatTanggalPanjang(tanggal)} — ${jurusanLabelFor(jurusanKey)}`);

  const rows = entries.map(e => {
    const row = [jMap[e.jurusan].label, formatRp(e.kotor), formatRp(e.untung)];
    KATEGORI_POTONGAN.forEach(k=>{
      row.push(`${entryFieldPercent(e,k.key)}%  ${formatRp(entryFieldNominal(e,k.key))}`);
    });
    return row;
  });
  const totalKotor = entries.reduce((s,e)=>s+e.kotor,0);
  const totalUntung = entries.reduce((s,e)=>s+e.untung,0);
  if(entries.length){
    const totalRow = ['TOTAL', formatRp(totalKotor), formatRp(totalUntung)];
    KATEGORI_POTONGAN.forEach(k=>{
      const total = entries.reduce((s,e)=>s+entryFieldNominal(e,k.key),0);
      totalRow.push(formatRp(total));
    });
    rows.push(totalRow);
  }

  const head = [['Jurusan','Omzet','Laba Bersih', ...KATEGORI_POTONGAN.map(k=>k.short)]];

  doc.autoTable({
    startY: 46,
    head,
    body: rows.length ? rows : [['Tidak ada data', ...Array(2+KATEGORI_POTONGAN.length).fill('-')]],
    theme: 'grid',
    headStyles:{ fillColor:[11,42,69], textColor:255, fontSize:8.5 },
    bodyStyles:{ fontSize:8 },
    didParseCell: (data)=>{
      if(entries.length && data.row.index === rows.length-1 && data.section==='body'){
        data.cell.styles.fontStyle = 'bold';
        data.cell.styles.fillColor = [228,243,241];
      }
    }
  });
  doc.setFontSize(8);
  doc.setTextColor(110,110,110);
  doc.text('Catatan: Pengembangan SKABIC Jurusan, Pemeliharaan Alat Jurusan, Kas Jurusan, Kas SKABIC, dan Pelaku Produksi dihitung dari Laba Bersih (bukan Omzet).', 14, doc.lastAutoTable.finalY + 8);
  pdfFooter(doc);
  doc.save(`SKABIC-Harian-${tanggal}-${jurusanKey}.pdf`);
}

function generateBulananPDF(bulanStr, jurusanKey, entries){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ orientation:'landscape' });
  pdfHeader(doc, 'Rekap Keuangan Bulanan', `${formatBulanTahun(bulanStr)} — ${jurusanLabelFor(jurusanKey)}`);

  const jurusanList = jurusanKey==='semua' ? JURUSAN : [jMap[jurusanKey]];
  const aggJ = {};
  jurusanList.forEach(j => {
    aggJ[j.key] = { jumlah:0, kotor:0, untung:0 };
    KATEGORI_POTONGAN.forEach(k=>{ aggJ[j.key][k.key] = 0; });
  });
  entries.forEach(e=>{
    if(!aggJ[e.jurusan]) return;
    aggJ[e.jurusan].jumlah++; aggJ[e.jurusan].kotor+=e.kotor; aggJ[e.jurusan].untung+=e.untung;
    KATEGORI_POTONGAN.forEach(k=>{ aggJ[e.jurusan][k.key] += entryFieldNominal(e,k.key); });
  });
  const grandKotor = entries.reduce((s,e)=>s+e.kotor,0);
  const grandUntung = entries.reduce((s,e)=>s+e.untung,0);
  const grandByKat = {};
  KATEGORI_POTONGAN.forEach(k=>{ grandByKat[k.key] = entries.reduce((s,e)=>s+entryFieldNominal(e,k.key),0); });

  const rowsA = jurusanList.map(j => {
    const row = [j.label, String(aggJ[j.key].jumlah), formatRp(aggJ[j.key].kotor), formatRp(aggJ[j.key].untung)];
    KATEGORI_POTONGAN.forEach(k=> row.push(formatRp(aggJ[j.key][k.key])));
    return row;
  });
  const totalRowA = ['TOTAL', String(entries.length), formatRp(grandKotor), formatRp(grandUntung)];
  KATEGORI_POTONGAN.forEach(k=> totalRowA.push(formatRp(grandByKat[k.key])));
  rowsA.push(totalRowA);

  doc.autoTable({
    startY: 46,
    head: [['Jurusan','Trx','Omzet','Laba Bersih', ...KATEGORI_POTONGAN.map(k=>k.short)]],
    body: rowsA,
    theme: 'grid',
    headStyles:{ fillColor:[11,42,69], textColor:255, fontSize:8 },
    bodyStyles:{ fontSize:7.8 },
    didParseCell: (data)=>{
      if(data.row.index === rowsA.length-1 && data.section==='body'){
        data.cell.styles.fontStyle = 'bold';
        data.cell.styles.fillColor = [228,243,241];
      }
    }
  });

  const y2 = doc.lastAutoTable.finalY + 10;
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(30,30,30);
  doc.text('Rekap Harian dalam Bulan Ini', 14, y2);

  const dateMap = {};
  entries.forEach(e=>{
    if(!dateMap[e.tanggal]){
      dateMap[e.tanggal] = { jumlah:0, kotor:0, untung:0 };
      KATEGORI_POTONGAN.forEach(k=>{ dateMap[e.tanggal][k.key]=0; });
    }
    dateMap[e.tanggal].jumlah++; dateMap[e.tanggal].kotor+=e.kotor; dateMap[e.tanggal].untung+=e.untung;
    KATEGORI_POTONGAN.forEach(k=>{ dateMap[e.tanggal][k.key] += entryFieldNominal(e,k.key); });
  });
  const dates = Object.keys(dateMap).sort();
  const rowsB = dates.map(d => {
    const row = [formatTanggalPendek(d), String(dateMap[d].jumlah), formatRp(dateMap[d].kotor), formatRp(dateMap[d].untung)];
    KATEGORI_POTONGAN.forEach(k=> row.push(formatRp(dateMap[d][k.key])));
    return row;
  });
  if(dates.length){
    const totalRowB = ['TOTAL BULAN INI', String(entries.length), formatRp(grandKotor), formatRp(grandUntung)];
    KATEGORI_POTONGAN.forEach(k=> totalRowB.push(formatRp(grandByKat[k.key])));
    rowsB.push(totalRowB);
  }

  doc.autoTable({
    startY: y2 + 4,
    head: [['Tanggal','Trx','Omzet','Laba Bersih', ...KATEGORI_POTONGAN.map(k=>k.short)]],
    body: rowsB.length ? rowsB : [['Tidak ada data', ...Array(3+KATEGORI_POTONGAN.length).fill('-')]],
    theme: 'striped',
    headStyles:{ fillColor:[14,75,71], textColor:255, fontSize:7.5 },
    bodyStyles:{ fontSize:7.3 },
    didParseCell: (data)=>{
      if(dates.length && data.row.index === rowsB.length-1 && data.section==='body'){
        data.cell.styles.fontStyle = 'bold';
        data.cell.styles.fillColor = [228,243,241];
      }
    }
  });
  doc.setFontSize(8);
  doc.setTextColor(110,110,110);
  doc.text('Catatan: Pengembangan SKABIC Jurusan, Pemeliharaan Alat Jurusan, Kas Jurusan, Kas SKABIC, dan Pelaku Produksi dihitung dari Laba Bersih (bukan Omzet).', 14, doc.lastAutoTable.finalY + 8);

  pdfFooter(doc);
  doc.save(`SKABIC-Bulanan-${bulanStr}-${jurusanKey}.pdf`);
}

  const dlControls = document.getElementById('dl-controls');
  if(state.dlMode==='harian'){
    dlControls.innerHTML = `
      <div class="field">
        <label class="field-label">Pilih Tanggal</label>
        <input type="date" id="dl-tanggal" value="${state.dlTanggal}">
      </div>
      <div class="field">
        <label class="field-label">Pilih Jurusan</label>
        <select id="dl-jurusan">
          <option value="semua" ${state.dlJurusan==='semua'?'selected':''}>Semua Jurusan</option>
          ${JURUSAN.map(j=>`<option value="${j.key}" ${state.dlJurusan===j.key?'selected':''}>${j.label}</option>`).join('')}
        </select>
      </div>
      <button class="btn-primary" id="dl-preview-btn">Tampilkan Rekap Harian</button>
    `;
    document.getElementById('dl-tanggal').addEventListener('change', e=> setDlField('dlTanggal', e.target.value));
  }else{
    dlControls.innerHTML = `
      <div class="field">
        <label class="field-label">Pilih Bulan</label>
        <input type="month" id="dl-bulan" value="${state.dlBulan}">
      </div>
      <div class="field">
        <label class="field-label">Pilih Jurusan</label>
        <select id="dl-jurusan">
          <option value="semua" ${state.dlJurusan==='semua'?'selected':''}>Semua Jurusan</option>
          ${JURUSAN.map(j=>`<option value="${j.key}" ${state.dlJurusan===j.key?'selected':''}>${j.label}</option>`).join('')}
        </select>
      </div>
      <button class="btn-primary" id="dl-preview-btn">Tampilkan Rekap Bulanan</button>
    `;
    document.getElementById('dl-bulan').addEventListener('change', e=> setDlField('dlBulan', e.target.value));
  }
  document.getElementById('dl-jurusan').addEventListener('change', e=> setDlField('dlJurusan', e.target.value));
  document.getElementById('dl-preview-btn').addEventListener('click', tampilkanDownloadPreview);

  renderDlResult(document.getElementById('dl-result'));

  document.getElementById('filter-select').addEventListener('change', e=> setFilterJurusan(e.target.value));
  const list = document.getElementById('riwayat-list');
  if(dates.length===0){
    list.innerHTML = `<div class="empty-state">${ICONS.empty}<p>Belum ada data untuk ditampilkan.</p></div>`;
    return;
  }
  list.innerHTML = dates.map(dstr=>{
    const dayEntries = entries.filter(e=>e.tanggal===dstr);
    const totalKotor = dayEntries.reduce((s,e)=>s+e.kotor,0);
    const totalUntung = dayEntries.reduce((s,e)=>s+e.untung,0);
    return `
      <div class="card date-group">
        <div class="date-head">
          <div class="d-label">${formatTanggalPanjang(dstr)}</div>
          <div class="d-sub">${dayEntries.length} transaksi</div>
        </div>
        ${dayEntries.map(e=>`
          <div class="entry-row">
            <div class="j-badge" style="background:${jMap[e.jurusan].color};width:28px;height:28px;">${jMap[e.jurusan].icon.replace('width="17" height="17"','width="14" height="14"')}</div>
            <div class="entry-info">
              <div class="entry-jname">${jMap[e.jurusan].label}</div>
              ${renderEntryBreakdownHtml(e)}
            </div>
          </div>
        `).join('')}
        <div class="day-total">
          <div class="t-lbl">Total Hari Ini</div>
          <div class="t-val">Omzet ${formatRp(totalKotor)} · Laba ${formatRp(totalUntung)}</div>
        </div>
      </div>
    `;
  }).join('');
}

function renderDlResult(resultEl){
  if(state.dlResult === null){ resultEl.innerHTML=''; return; }
  const { type, entries } = state.dlResult;
  if(entries.length === 0){
    resultEl.innerHTML = `<div class="card empty-state">${ICONS.empty}<p>Tidak ada transaksi pada ${type==='harian'?'tanggal':'bulan'} tersebut.</p></div>`;
    return;
  }
  const jurusanList = state.dlJurusan==='semua' ? JURUSAN : [jMap[state.dlJurusan]];
  const agg = {};
  jurusanList.forEach(j => {
    agg[j.key] = { jumlah:0, kotor:0, untung:0 };
    KATEGORI_POTONGAN.forEach(k=>{ agg[j.key][k.key]=0; });
  });
  entries.forEach(e=>{
    if(!agg[e.jurusan]) return;
    agg[e.jurusan].jumlah++; agg[e.jurusan].kotor+=e.kotor; agg[e.jurusan].untung+=e.untung;
    KATEGORI_POTONGAN.forEach(k=>{ agg[e.jurusan][k.key] += entryFieldNominal(e,k.key); });
  });
  const grandKotor = entries.reduce((s,e)=>s+e.kotor,0);
  const grandUntung = entries.reduce((s,e)=>s+e.untung,0);
  const grandByKat = {};
  KATEGORI_POTONGAN.forEach(k=>{ grandByKat[k.key] = entries.reduce((s,e)=>s+entryFieldNominal(e,k.key),0); });
  const label = type==='harian' ? formatTanggalPendek(state.dlTanggal) : formatBulanTahun(state.dlBulan);

  resultEl.innerHTML = `
    <div class="card">
      <div class="stamp">${stampSVG(label, type==='harian')}</div>
      <div style="overflow-x:auto;">
      <table class="rekap-table" style="min-width:680px;">
        <thead><tr><th>Jurusan</th><th>Trx</th><th>Omzet</th><th>Laba Bersih</th>${KATEGORI_POTONGAN.map(k=>`<th>${k.short}</th>`).join('')}</tr></thead>
        <tbody>
          ${jurusanList.map(j=>`
            <tr>
              <td class="jname"><span class="chip"><span class="dot" style="background:${j.color}"></span>${j.label}</span></td>
              <td>${agg[j.key].jumlah}</td>
              <td>${formatRp(agg[j.key].kotor)}</td>
              <td>${formatRp(agg[j.key].untung)}</td>
              ${KATEGORI_POTONGAN.map(k=>`<td>${formatRp(agg[j.key][k.key])}</td>`).join('')}
            </tr>
          `).join('')}
          <tr class="total-row">
            <td class="jname">Total</td>
            <td>${entries.length}</td>
            <td>${formatRp(grandKotor)}</td>
            <td>${formatRp(grandUntung)}</td>
            ${KATEGORI_POTONGAN.map(k=>`<td>${formatRp(grandByKat[k.key])}</td>`).join('')}
          </tr>
        </tbody>
      </table>
      </div>
      <div style="height:14px"></div>
      <button class="btn-secondary" id="dl-download-btn">${ICONS.download} Unduh PDF ${type==='harian'?'Harian':'Bulanan'}</button>
      <p class="hint">File PDF memuat rincian tiap transaksi beserta persentase dan nominal kelima pembagian Laba Bersih${type==='bulanan' ? ', lengkap dengan rekap harian yang dijumlahkan selama satu bulan.' : '.'}</p>
    </div>
  `;
  document.getElementById('dl-download-btn').addEventListener('click', ()=>{
    if(type==='harian') generateHarianPDF(state.dlTanggal, state.dlJurusan, entries);
    else generateBulananPDF(state.dlBulan, state.dlJurusan, entries);
  });
}

function stampSVG(label, isHarian){
  const modeLabel = isHarian ? 'SKABIC · REKAP HARIAN' : 'SKABIC · REKAP BULANAN';
  return `
  <svg viewBox="0 0 120 120">
    <circle cx="60" cy="60" r="54" fill="none" stroke="var(--gold)" stroke-width="2"/>
    <circle cx="60" cy="60" r="47" fill="none" stroke="var(--gold)" stroke-width="1"/>
    <path id="arcTop" d="M 18 60 A 42 42 0 0 1 102 60" fill="none"/>
    <text font-family="IBM Plex Mono, monospace" font-size="7" font-weight="600" fill="var(--gold)" letter-spacing="1.3">
      <textPath href="#arcTop" startOffset="50%" text-anchor="middle">${modeLabel}</textPath>
    </text>
    <text x="60" y="64" text-anchor="middle" font-family="Manrope, sans-serif" font-weight="600" font-size="10" fill="var(--navy-deep)">${label}</text>
  </svg>`;
}

function renderStaffList(container){
  if(state.staffList.length === 0){
    container.innerHTML = `<div class="empty-state">${ICONS.empty}<p>Belum ada data petugas terdaftar.</p></div>`;
    return;
  }
  container.innerHTML = state.staffList.map(s=>{
    if(state.adminStaffEditId === s.id){
      const f = state.adminStaffEditForm;
      return `
        <div class="edit-form" data-staff-edit-id="${s.id}">
          <div class="field">
            <label class="field-label">Nomor NIP</label>
            <input type="text" class="staff-edit-nip" value="${f.nip}">
          </div>
          <div class="field">
            <label class="field-label">Nama Petugas</label>
            <input type="text" class="staff-edit-nama" value="${f.nama}">
          </div>
          <div class="edit-actions">
            <button class="btn-primary" data-staff-save="${s.id}" style="flex:1;">Simpan</button>
            <button class="btn-secondary" data-staff-cancel="${s.id}" style="flex:1;">Batal</button>
          </div>
        </div>
      `;
    }
    return `
      <div class="entry-row">
        <div class="entry-info">
          <div class="entry-jname">${s.nama}</div>
          <div class="entry-figures">NIP: <b>${s.nip}</b></div>
        </div>
        <div class="entry-actions">
          <button class="icon-btn edit" data-staff-editbtn="${s.id}">${ICONS.edit}</button>
          <button class="icon-btn del" data-staff-delbtn="${s.id}">${ICONS.trash}</button>
        </div>
      </div>
    `;
  }).join('');

  container.querySelectorAll('[data-staff-editbtn]').forEach(btn=>{
    btn.addEventListener('click', ()=> startEditStaff(btn.getAttribute('data-staff-editbtn')));
  });
  container.querySelectorAll('[data-staff-delbtn]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(confirm('Hapus data petugas ini? Petugas tidak akan bisa login lagi dengan NIP ini.')) deleteStaffAdmin(btn.getAttribute('data-staff-delbtn'));
    });
  });
  container.querySelectorAll('[data-staff-save]').forEach(btn=>{
    btn.addEventListener('click', saveStaffEdit);
  });
  container.querySelectorAll('[data-staff-cancel]').forEach(btn=>{
    btn.addEventListener('click', cancelEditStaff);
  });
  container.querySelectorAll('.edit-form[data-staff-edit-id]').forEach(form=>{
    form.querySelector('.staff-edit-nip').addEventListener('input', e=> updateStaffEditForm('nip', e.target.value));
    form.querySelector('.staff-edit-nama').addEventListener('input', e=> updateStaffEditForm('nama', e.target.value));
  });
}

function renderAdminEntryList(container){
  const entries = [...state.entries].sort((a,b)=> b.tanggal.localeCompare(a.tanggal) || b.createdAt-a.createdAt);
  if(entries.length === 0){
    container.innerHTML = `<div class="empty-state">${ICONS.empty}<p>Belum ada data tersimpan.</p></div>`;
    return;
  }
  const dates = [...new Set(entries.map(e=>e.tanggal))];
  container.innerHTML = dates.map(dstr=>{
    const dayEntries = entries.filter(e=>e.tanggal===dstr);
    return `
      <div class="date-group">
        <div class="date-head">
          <div class="d-label" style="font-size:13px;">${formatTanggalPanjang(dstr)}</div>
        </div>
        ${dayEntries.map(e=>{
          if(state.adminEditId === e.id){
            const f = state.adminEditForm;
            return `
              <div class="edit-form" data-edit-id="${e.id}">
                <div class="field">
                  <label class="field-label">Jurusan</label>
                  <select class="edit-jurusan">
                    ${JURUSAN.map(j=>`<option value="${j.key}" ${f.jurusan===j.key?'selected':''}>${j.label}</option>`).join('')}
                  </select>
                </div>
                <div class="field">
                  <label class="field-label">Tanggal</label>
                  <input type="date" class="edit-tanggal" value="${f.tanggal}">
                </div>
                <div class="field">
                  <label class="field-label">Omzet (Rp)</label>
                  <input type="text" inputmode="numeric" autocomplete="off" class="edit-kotor" value="${formatThousands(f.kotor)}">
                </div>
                <div class="field">
                  <label class="field-label">Laba Bersih (Rp)</label>
                  <input type="text" inputmode="numeric" autocomplete="off" class="edit-untung" value="${formatThousands(f.untung)}">
                </div>
                <div class="edit-actions">
                  <button class="btn-primary" data-save="${e.id}" style="flex:1;">Simpan</button>
                  <button class="btn-secondary" data-cancel="${e.id}" style="flex:1;">Batal</button>
                </div>
              </div>
            `;
          }
          return `
            <div class="entry-row">
              <div class="j-badge" style="background:${jMap[e.jurusan].color};width:28px;height:28px;">${jMap[e.jurusan].icon.replace('width="17" height="17"','width="14" height="14"')}</div>
              <div class="entry-info">
                <div class="entry-jname">${jMap[e.jurusan].label}</div>
                ${renderEntryBreakdownHtml(e)}
              </div>
              <div class="entry-actions">
                <button class="icon-btn edit" data-editbtn="${e.id}">${ICONS.edit}</button>
                <button class="icon-btn del" data-delbtn="${e.id}">${ICONS.trash}</button>
              </div>
            </div>
          `;
        }).join('')}
      </div>
    `;
  }).join('');

  container.querySelectorAll('[data-editbtn]').forEach(btn=>{
    btn.addEventListener('click', ()=> startEditEntry(btn.getAttribute('data-editbtn')));
  });
  container.querySelectorAll('[data-delbtn]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(confirm('Hapus data transaksi ini secara permanen?')) deleteEntryAdmin(btn.getAttribute('data-delbtn'));
    });
  });
  container.querySelectorAll('[data-save]').forEach(btn=>{
    btn.addEventListener('click', saveEditEntry);
  });
  container.querySelectorAll('[data-cancel]').forEach(btn=>{
    btn.addEventListener('click', cancelEditEntry);
  });
  container.querySelectorAll('.edit-form[data-edit-id]').forEach(form=>{
    form.querySelector('.edit-jurusan').addEventListener('change', e=> updateEditForm('jurusan', e.target.value));
    form.querySelector('.edit-tanggal').addEventListener('change', e=> updateEditForm('tanggal', e.target.value));
    bindMoneyInput(form.querySelector('.edit-kotor'), v=> updateEditForm('kotor', v));
    bindMoneyInput(form.querySelector('.edit-untung'), v=> updateEditForm('untung', v));
  });
}
