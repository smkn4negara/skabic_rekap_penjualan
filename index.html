<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SKABIC — Rekap Keuangan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --ink:#1C2B3A;
    --ink-soft:#5B6B7C;
    --paper:#F1F3ED;
    --paper-line:#DBDFD3;
    --card:#FFFFFF;
    --gold:#B8873A;
    --gold-soft:#F1E4C6;
    --navy-deep:#14202E;
    --navy-deep-2:#1D2E42;
    --danger:#B23A3A;
    --hotel:#2C5F8A;
    --hotel-bg:#E6EEF4;
    --kuliner:#C1622B;
    --kuliner-bg:#F7E7DC;
    --kesehatan:#2F7865;
    --kesehatan-bg:#E1EFEA;
    --farmasi:#6B4C7A;
    --farmasi-bg:#EAE2ED;
    --radius:14px;
    --shadow: 0 1px 2px rgba(20,32,46,0.06), 0 6px 20px rgba(20,32,46,0.07);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    font-family:'Inter',sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #root{
    max-width:480px;
    margin:0 auto;
    min-height:100vh;
    background:var(--paper);
    display:flex;
    flex-direction:column;
    position:relative;
    box-shadow: 0 0 40px rgba(20,32,46,0.08);
  }
  @media (min-width:520px){
    body{ background: linear-gradient(180deg,#0E1A26,#233348 100%); padding:24px 0; }
    #root{ min-height:calc(100vh - 48px); border-radius:22px; overflow:hidden; }
  }

  /* ---------- Header ---------- */
  .topbar{
    background: radial-gradient(120% 140% at 0% 0%, #223349 0%, var(--navy-deep) 60%);
    color:#fff;
    padding:22px 20px 18px;
    position:relative;
    overflow:hidden;
  }
  .topbar::after{
    content:"";
    position:absolute; inset:0;
    background-image: repeating-linear-gradient(180deg, rgba(255,255,255,0.035) 0px, rgba(255,255,255,0.035) 1px, transparent 1px, transparent 26px);
    pointer-events:none;
  }
  .brand-text{ position:relative; z-index:1; }
  .brand-text h1{ font-family:'Fraunces',serif; font-weight:700; font-size:22px; margin:0; letter-spacing:0.3px; }
  .brand-text p{ margin:2px 0 0; font-size:12px; color:#B9C4D2; letter-spacing:0.3px; }
  .topbar-summary{
    position:relative; z-index:1;
    margin-top:16px;
    display:flex; gap:10px;
  }
  .sum-card{
    flex:1; background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.12);
    border-radius:12px; padding:10px 12px;
  }
  .sum-card .lbl{ font-size:10.5px; color:#9FB0C2; text-transform:uppercase; letter-spacing:0.6px;}
  .sum-card .val{ font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:15px; margin-top:3px; color:#F4EBD6;}

  /* ---------- Top Tabs (nav) ---------- */
  .top-tabs{
    position:sticky; top:0; z-index:6;
    display:flex;
    background:#fff;
    border-bottom:1px solid var(--paper-line);
    padding:6px 8px;
    gap:4px;
    box-shadow:0 2px 8px rgba(20,32,46,0.05);
  }
  .nav-btn{
    flex:1; border:none; background:transparent; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px;
    padding:8px 4px 7px; border-radius:10px; color:var(--ink-soft);
    font-family:'Inter',sans-serif; font-size:11px; font-weight:600;
    transition: color .15s, background .15s;
  }
  .nav-btn svg{ width:20px; height:20px; }
  .nav-btn.active{ color:var(--navy-deep); background:var(--gold-soft); }
  .nav-btn.active svg{ stroke:var(--navy-deep); }

  main{ flex:1; padding:16px 16px 26px; overflow-y:auto; }

  h2.section-title{
    font-family:'Fraunces',serif; font-weight:600; font-size:18px; margin:2px 0 3px;
  }
  p.section-sub{ font-size:12.5px; color:var(--ink-soft); margin:0 0 16px; }

  /* ---------- Cards / Forms ---------- */
  .card{
    background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow);
    padding:16px; margin-bottom:14px; border:1px solid rgba(20,32,46,0.04);
  }
  label.field-label{
    display:block; font-size:11.5px; font-weight:600; color:var(--ink-soft);
    text-transform:uppercase; letter-spacing:0.5px; margin:0 0 8px;
  }
  .jurusan-grid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:6px;}
  .jurusan-grid.has-error{ outline:1.5px dashed var(--danger); outline-offset:6px; border-radius:12px; }
  .field-error{ color:var(--danger); font-size:11.5px; font-weight:600; margin:0 0 14px; }
  input.has-error, select.has-error{ border-color:var(--danger) !important; background:#FBF0F0; }
  .jurusan-opt{
    border:1.5px solid var(--paper-line); border-radius:11px; padding:10px 10px;
    display:flex; align-items:center; gap:8px; cursor:pointer; background:#fff;
    transition: border-color .15s, background .15s, transform .1s;
  }
  .jurusan-opt:active{ transform:scale(0.98); }
  .jurusan-opt.selected{ border-color: var(--sel-color, var(--gold)); background: var(--sel-bg, var(--gold-soft)); }
  .j-badge{
    width:32px;height:32px;border-radius:50%; flex-shrink:0;
    display:flex;align-items:center;justify-content:center;
    color:#fff;
  }
  .j-badge svg{ width:17px; height:17px; }
  .j-name{ font-size:12.5px; font-weight:600; line-height:1.25; }

  input[type=date], input[type=month], input[type=text], input[type=number], input[type=password], select{
    width:100%; border:1.5px solid var(--paper-line); border-radius:10px;
    padding:11px 12px; font-size:14.5px; font-family:'IBM Plex Mono',monospace;
    background:#fff; color:var(--ink); outline:none;
  }
  input:focus, select:focus{ border-color:var(--navy-deep); }
  .field{ margin-bottom:14px; }
  .rp-preview{ font-size:11.5px; color:var(--gold); margin-top:5px; font-weight:600; font-family:'IBM Plex Mono',monospace;}

  .potongan-box{
    background:var(--gold-soft); border-radius:9px; padding:9px 12px; margin-top:8px;
    display:flex; justify-content:space-between; align-items:center; gap:8px;
  }
  .potongan-box .p-lbl{ font-size:10.5px; font-weight:700; color:#7A5A22; text-transform:uppercase; letter-spacing:0.3px; }
  .potongan-box .p-val{ font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:12.5px; color:#5C3F14; text-align:right; }

  .btn-primary{
    width:100%; border:none; border-radius:11px; padding:13px 16px;
    background: linear-gradient(180deg,#223349,var(--navy-deep));
    color:#fff; font-weight:700; font-size:14px; cursor:pointer;
    font-family:'Inter',sans-serif; letter-spacing:0.2px;
    box-shadow: 0 4px 12px rgba(20,32,46,0.25);
  }
  .btn-primary:active{ transform: translateY(1px); }
  .btn-secondary{
    width:100%; border:1.5px solid var(--navy-deep); border-radius:11px; padding:11px 16px;
    background:#fff; color:var(--navy-deep); font-weight:700; font-size:13.5px; cursor:pointer;
    font-family:'Inter',sans-serif; display:flex; align-items:center; justify-content:center; gap:6px;
  }
  .btn-secondary svg{ width:16px; height:16px; }
  .btn-small{
    border:1.5px solid var(--paper-line); border-radius:9px; padding:7px 12px;
    background:#fff; font-weight:700; font-size:11.5px; cursor:pointer; font-family:'Inter',sans-serif;
    display:inline-flex; align-items:center; gap:5px; color:var(--ink);
  }
  .btn-small svg{ width:13px;height:13px; }
  .btn-small.danger{ color:var(--danger); border-color:#EAD0D0; }
  .btn-small.gold{ color:#7A5A22; border-color:var(--gold); background:var(--gold-soft); }

  .toast{
    position:fixed; left:50%; bottom:24px; transform:translateX(-50%) translateY(10px);
    background:var(--navy-deep); color:#fff; padding:10px 18px; border-radius:999px;
    font-size:13px; font-weight:600; box-shadow:0 8px 20px rgba(0,0,0,0.25);
    opacity:0; pointer-events:none; transition:opacity .25s, transform .25s;
    z-index:50; white-space:nowrap; max-width:88%; text-align:center;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }

  /* ---------- Riwayat ---------- */
  .filter-row{ display:flex; gap:8px; margin-bottom:14px; }
  .filter-row select{ font-family:'Inter',sans-serif; font-weight:600; font-size:12.5px; padding:9px 10px;}

  .mode-tabs{
    display:flex; background:var(--paper); border:1.5px solid var(--paper-line); border-radius:12px;
    padding:3px; margin-bottom:14px; gap:2px;
  }
  .mode-tab{
    flex:1; text-align:center; padding:10px 6px; border-radius:9px; border:none;
    font-size:12.5px; font-weight:700; color:var(--ink-soft); cursor:pointer;
    font-family:'Inter',sans-serif; background:transparent; transition: background .15s, color .15s;
  }
  .mode-tab.active{ background:var(--navy-deep); color:#fff; }

  .date-group{ margin-bottom:14px; }
  .date-head{ padding:2px 2px 8px; }
  .date-head .d-label{ font-family:'Fraunces',serif; font-weight:600; font-size:14.5px;}
  .date-head .d-sub{ font-size:10.5px; color:var(--ink-soft); }
  .entry-row{
    display:flex; align-items:center; gap:10px; padding:10px 4px;
    border-bottom:1px dashed var(--paper-line);
  }
  .entry-row:last-child{ border-bottom:none; }
  .entry-info{ flex:1; min-width:0; }
  .entry-jname{ font-size:12.5px; font-weight:700; }
  .entry-figures{ font-family:'IBM Plex Mono',monospace; font-size:11px; color:var(--ink-soft); margin-top:2px; line-height:1.6;}
  .entry-figures b{ color:var(--ink); font-weight:600; }
  .entry-actions{ display:flex; gap:6px; flex-shrink:0; }
  .icon-btn{
    border:none; background:transparent; color:#C9CFD6; cursor:pointer; padding:6px;
    display:flex;
  }
  .icon-btn.edit:hover{ color:var(--navy-deep); }
  .icon-btn.del:hover{ color:var(--danger); }
  .icon-btn svg{ width:16px;height:16px; }

  .day-total{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--gold-soft); border-radius:9px; padding:9px 12px; margin:10px 0 4px;
  }
  .day-total .t-lbl{ font-size:11px; font-weight:700; color:#7A5A22; text-transform:uppercase; letter-spacing:0.4px;}
  .day-total .t-val{ font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:12.5px; color:#5C3F14;}

  .stamp{ width:104px;height:104px; margin:6px auto 4px; position:relative; }
  .stamp svg{ width:100%; height:100%; }

  .empty-state{ text-align:center; padding:40px 10px; color:var(--ink-soft); }
  .empty-state svg{ width:52px;height:52px; margin-bottom:10px; opacity:0.5;}
  .empty-state p{ font-size:13px; margin:0; }

  .range-row{ display:flex; gap:8px; align-items:flex-end; }
  .range-row .field{ flex:1; margin-bottom:0; }

  table.rekap-table{ width:100%; border-collapse:collapse; margin-top:6px; }
  table.rekap-table th{
    text-align:left; font-size:10px; text-transform:uppercase; letter-spacing:0.4px;
    color:var(--ink-soft); padding:6px 6px; border-bottom:1.5px solid var(--paper-line);
  }
  table.rekap-table td{
    padding:8px 6px; font-size:11.5px; border-bottom:1px dashed var(--paper-line);
    font-family:'IBM Plex Mono',monospace;
  }
  table.rekap-table td.jname{ font-family:'Inter',sans-serif; font-weight:700; font-size:12px; }
  table.rekap-table tr.total-row td{
    border-top:1.5px solid var(--ink); border-bottom:none; font-weight:700; padding-top:9px;
  }
  .chip{ display:inline-flex; align-items:center; gap:5px; font-size:11px; font-weight:700; }
  .dot{ width:8px;height:8px;border-radius:50%; }
  .hint{ font-size:11px; color:var(--ink-soft); margin-top:6px; line-height:1.5;}

  /* ---------- Password gate ---------- */
  .password-screen{ text-align:center; padding:30px 6px 10px; }
  .lock-badge{
    width:60px;height:60px;border-radius:50%; margin:0 auto 16px;
    background:var(--gold-soft); display:flex;align-items:center;justify-content:center;
    color:#7A5A22;
  }
  .lock-badge svg{ width:26px;height:26px; }
  .password-screen h3{ font-family:'Fraunces',serif; font-weight:600; font-size:17px; margin:0 0 4px; }
  .password-screen p{ font-size:12.5px; color:var(--ink-soft); margin:0 0 18px; }

  /* ---------- Settings ---------- */
  .settings-section{ margin-bottom:20px; }
  .settings-section h4{ font-family:'Fraunces',serif; font-weight:600; font-size:14.5px; margin:0 0 10px; }
  .logo-preview-wrap{ display:flex; flex-direction:column; align-items:center; gap:12px; padding:6px 0 4px; }
  .logo-preview-banner{
    width:100%; max-width:260px; height:80px; border-radius:12px; overflow:hidden;
    background: repeating-linear-gradient(45deg, #f4f2ea, #f4f2ea 8px, #ece8db 8px, #ece8db 16px);
    display:flex;align-items:center;justify-content:center; border:1.5px dashed var(--paper-line);
  }
  .logo-preview-banner img{ width:100%; height:100%; object-fit:contain; }
  .logo-preview-banner .ph{ font-family:'Fraunces',serif; font-weight:700; font-size:15px; color:var(--ink-soft); text-align:center; padding:0 10px; }
  .file-label{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    border:1.5px solid var(--navy-deep); border-radius:11px; padding:11px 16px;
    background:#fff; color:var(--navy-deep); font-weight:700; font-size:13.5px; cursor:pointer;
    font-family:'Inter',sans-serif; width:100%;
  }
  .file-label svg{ width:16px;height:16px; }
  .btn-danger-text{
    width:100%; border:none; background:transparent; color:var(--danger); font-weight:600;
    font-size:12.5px; padding:10px; cursor:pointer; font-family:'Inter',sans-serif;
  }
  .inline-row{ display:flex; gap:8px; align-items:flex-end; }
  .inline-row .field{ flex:1; margin-bottom:0; }
  .divider{ height:1px; background:var(--paper-line); margin:18px 0; }
  .edit-form{ background:var(--paper); border-radius:11px; padding:12px; margin:6px 0 12px; border:1.5px solid var(--paper-line); }
  .edit-form .field{ margin-bottom:10px; }
  .edit-actions{ display:flex; gap:8px; margin-top:4px; }
  .edit-actions .btn-primary, .edit-actions .btn-secondary{ padding:10px; font-size:12.5px; }

  .db-status{
    display:flex; align-items:center; gap:8px; padding:9px 12px; border-radius:9px;
    font-size:11.5px; font-weight:700; margin-bottom:14px;
  }
  .db-status.connected{ background:#E1EFEA; color:#1F5B47; }
  .db-status.disconnected{ background:#F1EDE2; color:#7A6A4A; }
  .db-status .dot2{ width:8px;height:8px;border-radius:50%; flex-shrink:0; }
  .db-status.connected .dot2{ background:#2F9165; }
  .db-status.disconnected .dot2{ background:#C99A46; }
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ============ CONFIG ============ */
const DEFAULT_PASSWORD = 'skabic123';
const DEFAULT_PERCENT = 25;

const JURUSAN = [
  { key:'hotel', label:'Perhotelan', color:'var(--hotel)', bg:'var(--hotel-bg)',
    icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4v16"/><path d="M2 8h17a3 3 0 013 3v9"/><path d="M2 17h22"/><path d="M6 8v9"/></svg>` },
  { key:'kuliner', label:'Kuliner', color:'var(--kuliner)', bg:'var(--kuliner-bg)',
    icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21a1 1 0 001-1v-5.4c0-.5.3-.9.73-1.1a4 4 0 00-2.14-7.6 5 5 0 00-9.18 0 4 4 0 00-2.14 7.6c.43.2.73.6.73 1.1V20a1 1 0 001 1z"/><path d="M6 17h12"/></svg>` },
  { key:'kesehatan', label:'Layanan Kesehatan', color:'var(--kesehatan)', bg:'var(--kesehatan-bg)',
    icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12h14"/></svg>` },
  { key:'farmasi', label:'Farmasi', color:'var(--farmasi)', bg:'var(--farmasi-bg)',
    icon:`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 20.5 3.5 13.5a4.95 4.95 0 117-7l7 7a4.95 4.95 0 11-7 7Z"/><path d="M8.3 8.3l7.4 7.4"/></svg>` },
];
const jMap = Object.fromEntries(JURUSAN.map(j=>[j.key,j]));

const ICONS = {
  input: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>`,
  riwayat: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2"/></svg>`,
  setting: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>`,
  download: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>`,
  trash: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18M8 6V4a1 1 0 011-1h6a1 1 0 011 1v2m2 0l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6"/></svg>`,
  edit: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 013 3L7 19l-4 1 1-4 12.5-12.5z"/></svg>`,
  empty: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M4 20V7a2 2 0 012-2h6l4 4h2a2 2 0 012 2v9a2 2 0 01-2 2H6a2 2 0 01-2-2z"/></svg>`,
  upload: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9m0 0l-4 4m4-4l4 4"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>`,
  lock: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg>`,
  logout: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>`,
  database: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>`,
};

/* ============ STATE ============ */
let state = {
  currentView: 'input',
  loading: true,
  entries: [],
  logo: null,
  percent: DEFAULT_PERCENT,

function todayStr(){
  const d = new Date();
  const off = d.getTimezoneOffset();
  const local = new Date(d.getTime() - off*60000);
  return local.toISOString().slice(0,10);
}
function currentMonthStr(){ return todayStr().slice(0,7); }
function formatRp(n){ n = Number(n)||0; return 'Rp ' + n.toLocaleString('id-ID'); }
function formatTanggalPanjang(dstr){
  const d = new Date(dstr+'T00:00:00');
  return d.toLocaleDateString('id-ID', { weekday:'long', day:'numeric', month:'long', year:'numeric' });
}
function formatTanggalPendek(dstr){
  const d = new Date(dstr+'T00:00:00');
  return d.toLocaleDateString('id-ID', { day:'2-digit', month:'short', year:'numeric' });
}
function formatBulanTahun(mstr){
  const d = new Date(mstr+'-01T00:00:00');
  return d.toLocaleDateString('id-ID', { month:'long', year:'numeric' });
}
function uid(){ return 'e' + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function jurusanLabelFor(key){ return key==='semua' ? 'Semua Jurusan' : jMap[key].label; }

/* ============ SUPABASE CONNECTION ============ */
async function loadSupabaseConfig(){
  try{
    const res = await window.storage.get('skabic-supabase-config', true);
    if(res && res.value){
      const cfg = JSON.parse(res.value);
      state.supabaseUrl = cfg.url || '';
      state.supabaseKey = cfg.key || '';
    }
  }catch(e){ /* belum dikonfigurasi */ }
  state.supabaseUrlInput = state.supabaseUrl;
  state.supabaseKeyInput = state.supabaseKey;
}
async function connectSupabase(url, key){
  if(!url || !key){ showToast('Isi URL dan Anon Key Supabase terlebih dahulu'); return false; }
  try{
    const { createClient } = window.supabase;
    const client = createClient(url, key);
    const { error } = await client.from('skabic_settings').select('id').limit(1);
    if(error) throw error;
    state.supabaseClient = client;
    state.supabaseUrl = url;
    state.supabaseKey = key;
    state.supabaseConnected = true;
    await window.storage.set('skabic-supabase-config', JSON.stringify({ url, key }), true);
    return true;
  }catch(e){
    state.supabaseConnected = false;
    showToast('Gagal terhubung ke Supabase. Periksa URL, Anon Key, dan tabel di database.');
    return false;
  }
}
async function disconnectSupabase(){
  state.supabaseClient = null;
  state.supabaseConnected = false;
  try{ await window.storage.delete('skabic-supabase-config', true); }catch(e){}
  showToast('Sambungan Supabase diputus, kembali ke penyimpanan bawaan');
  render();
}

/* ============ STORAGE / DB LAYER ============ */
async function loadAll(){
  await loadSupabaseConfig();
  let supabaseReady = false;
  if(state.supabaseUrl && state.supabaseKey){
    supabaseReady = await connectSupabase(state.supabaseUrl, state.supabaseKey);
  }

  if(supabaseReady){
    await dbLoadEntriesFromSupabase();
    await dbLoadSettingsFromSupabase();
  }else{
    await dbLoadEntriesFromLocal();
    await dbLoadSettingsFromLocal();
  }
  state.settingsPercentInput = String(state.percent);
  state.loading = false;
  render();
}

async function dbLoadEntriesFromSupabase(){
  try{
    const { data, error } = await state.supabaseClient
      .from('skabic_entries').select('*').order('tanggal', { ascending:false });
    if(error) throw error;
    state.entries = (data||[]).map(r=>({
      id: r.id, jurusan: r.jurusan, tanggal: r.tanggal,
      kotor: Number(r.kotor), untung: Number(r.untung),
      skabicPercent: Number(r.skabic_percent), skabicNominal: Number(r.skabic_nominal),
      createdAt: Number(r.created_at)
    }));
  }catch(e){
    showToast('Gagal memuat data dari Supabase');
    state.entries = [];
  }
}
async function dbLoadSettingsFromSupabase(){
  try{
    const { data, error } = await state.supabaseClient
      .from('skabic_settings').select('*').eq('id',1).maybeSingle();
    if(error) throw error;
    state.logo = data && data.logo ? data.logo : null;
    state.percent = data && data.percent!=null ? Number(data.percent) : DEFAULT_PERCENT;
    state.password = data && data.password ? data.password : DEFAULT_PASSWORD;
  }catch(e){
    state.logo = null; state.percent = DEFAULT_PERCENT; state.password = DEFAULT_PASSWORD;
  }
}
async function dbLoadEntriesFromLocal(){
  try{
    const res = await window.storage.get('skabic-entries', true);
    state.entries = res && res.value ? JSON.parse(res.value) : [];
  }catch(e){ state.entries = []; }
}
async function dbLoadSettingsFromLocal(){
  try{
    const res = await window.storage.get('skabic-logo', true);
    state.logo = res && res.value ? res.value : null;
  }catch(e){ state.logo = null; }
  try{
    const res = await window.storage.get('skabic-percent', true);
    state.percent = res && res.value ? Number(res.value) : DEFAULT_PERCENT;
  }catch(e){ state.percent = DEFAULT_PERCENT; }
  try{
    const res = await window.storage.get('skabic-password', true);
    state.password = res && res.value ? res.value : DEFAULT_PASSWORD;
  }catch(e){ state.password = DEFAULT_PASSWORD; }
}

async function persistEntries(){
  if(!state.supabaseConnected){
    try{ await window.storage.set('skabic-entries', JSON.stringify(state.entries), true); }
    catch(e){ showToast('Gagal menyimpan ke server, coba lagi.'); }
  }
}
async function dbInsertEntry(entry){
  if(state.supabaseConnected){
    try{
      const { error } = await state.supabaseClient.from('skabic_entries').insert({
        id: entry.id, jurusan: entry.jurusan, tanggal: entry.tanggal,
        kotor: entry.kotor, untung: entry.untung,
        skabic_percent: entry.skabicPercent, skabic_nominal: entry.skabicNominal,
        created_at: entry.createdAt
      });
      if(error) throw error;
    }catch(e){ showToast('Gagal menyimpan ke Supabase'); }
  }else{
    await persistEntries();
  }
}
async function dbUpdateEntry(id, fields){
  if(state.supabaseConnected){
    try{
      const { error } = await state.supabaseClient.from('skabic_entries').update({
        jurusan: fields.jurusan, tanggal: fields.tanggal,
        kotor: fields.kotor, untung: fields.untung,
        skabic_percent: fields.skabicPercent, skabic_nominal: fields.skabicNominal
      }).eq('id', id);
      if(error) throw error;
    }catch(e){ showToast('Gagal memperbarui data di Supabase'); }
  }else{
    await persistEntries();
  }
}
async function dbDeleteEntry(id){
  if(state.supabaseConnected){
    try{
      const { error } = await state.supabaseClient.from('skabic_entries').delete().eq('id', id);
      if(error) throw error;
    }catch(e){ showToast('Gagal menghapus data di Supabase'); }
  }else{
    await persistEntries();
  }
}
async function dbSaveSettings(fields){
  if(state.supabaseConnected){
    try{
      const payload = { id:1 };
      if('logo' in fields) payload.logo = fields.logo;
      if('percent' in fields) payload.percent = fields.percent;
      if('password' in fields) payload.password = fields.password;
      const { error } = await state.supabaseClient.from('skabic_settings').upsert(payload);
      if(error) throw error;
      return true;
    }catch(e){ showToast('Gagal menyimpan pengaturan ke Supabase'); return false; }
  }else{
    try{
      if('logo' in fields){
        if(fields.logo) await window.storage.set('skabic-logo', fields.logo, true);
        else await window.storage.delete('skabic-logo', true);
      }
      if('percent' in fields) await window.storage.set('skabic-percent', String(fields.percent), true);
      if('password' in fields) await window.storage.set('skabic-password', fields.password, true);
      return true;
    }catch(e){ showToast('Gagal menyimpan pengaturan'); return false; }
  }
}
async function saveLogo(dataUrl){ return dbSaveSettings({ logo:dataUrl }); }
async function removeLogo(){
  await dbSaveSettings({ logo:null });
  state.logo = null; render(); showToast('Logo dihapus');
}
function resizeLogoBanner(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = (ev)=>{
      const img = new Image();
      img.onload = ()=>{
        const W = 480, H = 140;
        const canvas = document.createElement('canvas');
        canvas.width = W; canvas.height = H;
        const ctx = canvas.getContext('2d');
        const scale = Math.min(W/img.width, H/img.height);
        const w = img.width*scale, h = img.height*scale;
        const x = (W-w)/2, y = (H-h)/2;
        ctx.clearRect(0,0,W,H);
        ctx.drawImage(img, x, y, w, h);
        resolve(canvas.toDataURL('image/png'));
      };
      img.onerror = ()=> reject(new Error('Gambar tidak dapat dibaca'));
      img.src = ev.target.result;
    };
    reader.onerror = ()=> reject(new Error('File tidak dapat dibaca'));
    reader.readAsDataURL(file);
  });
}
async function handleLogoUpload(file){
  if(!file) return;
  if(!file.type.startsWith('image/')){ showToast('File harus berupa gambar'); return; }
  try{
    const dataUrl = await resizeLogoBanner(file);
    const ok = await saveLogo(dataUrl);
    if(ok){ state.logo = dataUrl; render(); showToast('Logo berhasil diperbarui'); }
  }catch(e){ showToast('Gagal memproses gambar'); }
}

function showToast(msg){
  const t = document.getElementById('toast');
  if(!t) return;
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(window.__toastTimer);
  window.__toastTimer = setTimeout(()=> t.classList.remove('show'), 2400);
}

  state.form.jurusan = key;

  render();
}
function updateField(field, val){
  state.form[field] = val;
  if(state.formErrors[field]){ delete state.formErrors[field]; clearFieldErrorUI(field); }
  renderRpPreview();
}
function clearFieldErrorUI(field){
  const inputIdMap = { tanggal:'tanggal-input', kotor:'kotor-input', untung:'untung-input' };
  const inputId = inputIdMap[field];
  if(inputId){ const el = document.getElementById(inputId); if(el) el.classList.remove('has-error'); }
  const errEl = document.getElementById('error-'+field);
  if(errEl) errEl.remove();
}
function renderRpPreview(){
  const kEl = document.getElementById('kotor-preview');
  const uEl = document.getElementById('untung-preview');
  if(kEl) kEl.textContent = state.form.kotor ? formatRp(state.form.kotor) : '';
  if(uEl) uEl.textContent = state.form.untung ? formatRp(state.form.untung) : '';
  const pVal = document.getElementById('potongan-val');
  const pPct = document.getElementById('potongan-pct');
  if(pVal){
    const omzet = Number(state.form.kotor)||0;
    const nominal = Math.round(omzet * state.percent/100);
    pVal.textContent = formatRp(nominal);
  }
  if(pPct) pPct.textContent = state.percent + '%';
}

async function submitEntry(){
  const f = state.form;
  const errors = {};
  if(!f.jurusan) errors.jurusan = 'Pilih salah satu jurusan terlebih dahulu.';
  if(!f.tanggal) errors.tanggal = 'Tanggal wajib diisi.';
  const kotor = Number(f.kotor);
  const untung = Number(f.untung);
  if(f.kotor === '' || isNaN(kotor) || kotor < 0) errors.kotor = 'Omzet wajib diisi dengan angka yang benar.';
  if(f.untung === '' || isNaN(untung) || untung < 0) errors.untung = 'Laba Bersih wajib diisi dengan angka yang benar.';

  if(Object.keys(errors).length > 0){
    state.formErrors = errors;
    render();
    showToast(errors.jurusan ? 'Pilih jurusan terlebih dahulu sebelum menyimpan' : 'Lengkapi semua isian sebelum menyimpan');
    return;
  }

  state.formErrors = {};
  const percent = state.percent;
  const nominal = Math.round(kotor * percent/100);
  const newEntry = {
    id: uid(), jurusan: f.jurusan, tanggal: f.tanggal,
    kotor, untung, skabicPercent: percent, skabicNominal: nominal, createdAt: Date.now()
  };
  state.entries.push(newEntry);
  await dbInsertEntry(newEntry);
  showToast('Data berhasil disimpan');
  state.form = { jurusan:null, tanggal: f.tanggal, kotor:'', untung:'' };
  render();
}

    if(state.dlJurusan!=='semua') filtered = filtered.filter(e=>e.jurusan===state.dlJurusan);
    state.dlResult = { type:'bulanan', entries:filtered };
  }
  render();
}

function pdfHeader(doc, title, subtitle){

    try{ doc.addImage(state.logo, 'PNG', 12, 5, 62, 16); }catch(e){ /* ignore malformed image */ }
  }else{
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica','bold');
    doc.setFontSize(15);
    doc.text('SKABIC', 14, 13);
    doc.setFontSize(9);
    doc.setFont('helvetica','normal');
    doc.setTextColor(200,210,220);
    doc.text('Skanepa Business Center', 14, 19.5);
  }
  doc.setTextColor(30,30,30);
  doc.setFont('helvetica','bold');

  doc.text(title, 14, 34);
  doc.setFont('helvetica','normal');
  doc.setFontSize(9.5);

}
function pdfFooter(doc){
  const pageCount = doc.internal.getNumberOfPages();
  for(let i=1;i<=pageCount;i++){
    doc.setPage(i);
    doc.setFontSize(8);
    doc.setTextColor(150,150,150);
    doc.text('Dicetak otomatis oleh Aplikasi Rekap Keuangan SKABIC — ' + new Date().toLocaleString('id-ID'), 14, 289);
  }
}
function entryNominal(e){
  const percent = e.skabicPercent!=null ? e.skabicPercent : state.percent;
  return e.skabicNominal!=null ? e.skabicNominal : Math.round(e.kotor*percent/100);
}
function entryPercent(e){ return e.skabicPercent!=null ? e.skabicPercent : state.percent; }

function generateHarianPDF(tanggal, jurusanKey, entries){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  pdfHeader(doc, 'Rekap Keuangan Harian', `${formatTanggalPanjang(tanggal)} — ${jurusanLabelFor(jurusanKey)}`);

  const rows = entries.map(e => [
    jMap[e.jurusan].label, formatRp(e.kotor), entryPercent(e)+'%', formatRp(entryNominal(e)), formatRp(e.untung)
  ]);
  const totalKotor = entries.reduce((s,e)=>s+e.kotor,0);
  const totalNominal = entries.reduce((s,e)=>s+entryNominal(e),0);
  const totalUntung = entries.reduce((s,e)=>s+e.untung,0);
  if(entries.length){
    rows.push(['TOTAL', formatRp(totalKotor), '-', formatRp(totalNominal), formatRp(totalUntung)]);
  }

  doc.autoTable({
    startY: 46,
    head: [['Jurusan','Omzet','Potongan SKABIC','Nominal Potongan','Laba Bersih']],
    body: rows.length ? rows : [['Tidak ada data','-','-','-','-']],
    theme: 'grid',
    headStyles:{ fillColor:[28,43,58], textColor:255, fontSize:8.5 },
    bodyStyles:{ fontSize:8.5 },
    didParseCell: (data)=>{
      if(entries.length && data.row.index === rows.length-1 && data.section==='body'){
        data.cell.styles.fontStyle = 'bold';
        data.cell.styles.fillColor = [241,228,198];
      }
    }
  });
  pdfFooter(doc);
  doc.save(`SKABIC-Harian-${tanggal}-${jurusanKey}.pdf`);
}

function generateBulananPDF(bulanStr, jurusanKey, entries){
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  pdfHeader(doc, 'Rekap Keuangan Bulanan', `${formatBulanTahun(bulanStr)} — ${jurusanLabelFor(jurusanKey)}`);

  const jurusanList = jurusanKey==='semua' ? JURUSAN : [jMap[jurusanKey]];
  const aggJ = {};
  jurusanList.forEach(j => aggJ[j.key] = { jumlah:0, kotor:0, nominal:0, untung:0 });
  entries.forEach(e=>{
    if(!aggJ[e.jurusan]) return;
    aggJ[e.jurusan].jumlah++; aggJ[e.jurusan].kotor+=e.kotor; aggJ[e.jurusan].nominal+=entryNominal(e); aggJ[e.jurusan].untung+=e.untung;
  });
  const grandKotor = entries.reduce((s,e)=>s+e.kotor,0);
  const grandNominal = entries.reduce((s,e)=>s+entryNominal(e),0);
  const grandUntung = entries.reduce((s,e)=>s+e.untung,0);
  const rowsA = jurusanList.map(j => [j.label, String(aggJ[j.key].jumlah), formatRp(aggJ[j.key].kotor), formatRp(aggJ[j.key].nominal), formatRp(aggJ[j.key].untung)]);
  rowsA.push(['TOTAL', String(entries.length), formatRp(grandKotor), formatRp(grandNominal), formatRp(grandUntung)]);

  doc.autoTable({
    startY: 46,
    head: [['Jurusan','Jml Transaksi','Total Omzet','Total Potongan SKABIC','Total Laba Bersih']],
    body: rowsA,
    theme: 'grid',
    headStyles:{ fillColor:[28,43,58], textColor:255, fontSize:8.5 },
    bodyStyles:{ fontSize:8.5 },
    didParseCell: (data)=>{
      if(data.row.index === rowsA.length-1 && data.section==='body'){
        data.cell.styles.fontStyle = 'bold';
        data.cell.styles.fillColor = [241,228,198];
      }
    }
  });

  const y2 = doc.lastAutoTable.finalY + 10;
  doc.setFont('helvetica','bold'); doc.setFontSize(11); doc.setTextColor(30,30,30);
  doc.text('Rekap Harian dalam Bulan Ini', 14, y2);

  const dateMap = {};
  entries.forEach(e=>{
    if(!dateMap[e.tanggal]) dateMap[e.tanggal] = { jumlah:0, kotor:0, nominal:0, untung:0 };
    dateMap[e.tanggal].jumlah++; dateMap[e.tanggal].kotor+=e.kotor; dateMap[e.tanggal].nominal+=entryNominal(e); dateMap[e.tanggal].untung+=e.untung;
  });
  const dates = Object.keys(dateMap).sort();
  const rowsB = dates.map(d => [formatTanggalPendek(d), String(dateMap[d].jumlah), formatRp(dateMap[d].kotor), formatRp(dateMap[d].nominal), formatRp(dateMap[d].untung)]);
  if(dates.length){
    rowsB.push(['TOTAL BULAN INI', String(entries.length), formatRp(grandKotor), formatRp(grandNominal), formatRp(grandUntung)]);
  }

  doc.autoTable({
    startY: y2 + 4,
    head: [['Tanggal','Jml Transaksi','Omzet','Potongan SKABIC','Laba Bersih']],
    body: rowsB.length ? rowsB : [['Tidak ada data','-','-','-','-']],
    theme: 'striped',
    headStyles:{ fillColor:[80,90,102], textColor:255, fontSize:8 },
    bodyStyles:{ fontSize:8 },
    didParseCell: (data)=>{
      if(dates.length && data.row.index === rowsB.length-1 && data.section==='body'){
        data.cell.styles.fontStyle = 'bold';
        data.cell.styles.fillColor = [241,228,198];
      }
    }
  });

  pdfFooter(doc);
  doc.save(`SKABIC-Bulanan-${bulanStr}-${jurusanKey}.pdf`);
}

function renderDlResult(resultEl){
  if(state.dlResult === null){ resultEl.innerHTML=''; return; }
  const { type, entries } = state.dlResult;
  if(entries.length === 0){
    resultEl.innerHTML = `<div class="card empty-state">${ICONS.empty}<p>Tidak ada transaksi pada ${type==='harian'?'tanggal':'bulan'} tersebut.</p></div>`;
    return;
  }
  const jurusanList = state.dlJurusan==='semua' ? JURUSAN : [jMap[state.dlJurusan]];
  const agg = {};
  jurusanList.forEach(j => agg[j.key] = { jumlah:0, kotor:0, nominal:0, untung:0 });
  entries.forEach(e=>{
    if(!agg[e.jurusan]) return;
    agg[e.jurusan].jumlah++; agg[e.jurusan].kotor+=e.kotor; agg[e.jurusan].nominal+=entryNominal(e); agg[e.jurusan].untung+=e.untung;
  });
  const grandKotor = entries.reduce((s,e)=>s+e.kotor,0);
  const grandNominal = entries.reduce((s,e)=>s+entryNominal(e),0);
  const grandUntung = entries.reduce((s,e)=>s+e.untung,0);
  const label = type==='harian' ? formatTanggalPendek(state.dlTanggal) : formatBulanTahun(state.dlBulan);

  resultEl.innerHTML = `
    <div class="card">
      <div class="stamp">${stampSVG(label, type==='harian')}</div>
      <table class="rekap-table">
        <thead><tr><th>Jurusan</th><th>Trx</th><th>Omzet</th><th>Potongan SKABIC</th><th>Laba Bersih</th></tr></thead>
        <tbody>
          ${jurusanList.map(j=>`
            <tr>
              <td class="jname"><span class="chip"><span class="dot" style="background:${j.color}"></span>${j.label}</span></td>
              <td>${agg[j.key].jumlah}</td>
              <td>${formatRp(agg[j.key].kotor)}</td>
              <td>${formatRp(agg[j.key].nominal)}</td>
              <td>${formatRp(agg[j.key].untung)}</td>
            </tr>
          `).join('')}
          <tr class="total-row">
            <td class="jname">Total</td>
            <td>${entries.length}</td>
            <td>${formatRp(grandKotor)}</td>
            <td>${formatRp(grandNominal)}</td>
            <td>${formatRp(grandUntung)}</td>
          </tr>
        </tbody>
      </table>
      <div style="height:14px"></div>
      <button class="btn-secondary" id="dl-download-btn">${ICONS.download} Unduh PDF ${type==='harian'?'Harian':'Bulanan'}</button>
      <p class="hint">File PDF memuat rincian tiap transaksi beserta persentase dan nominal potongan SKABIC${type==='bulanan' ? ', lengkap dengan rekap harian yang dijumlahkan selama satu bulan.' : '.'}</p>
    </div>
  `;
  document.getElementById('dl-download-btn').addEventListener('click', ()=>{
    if(type==='harian') generateHarianPDF(state.dlTanggal, state.dlJurusan, entries);
    else generateBulananPDF(state.dlBulan, state.dlJurusan, entries);
  });
}

  container.querySelectorAll('[data-editbtn]').forEach(btn=>{
    btn.addEventListener('click', ()=> startEditEntry(btn.getAttribute('data-editbtn')));
  });
  container.querySelectorAll('[data-delbtn]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(confirm('Hapus data transaksi ini secara permanen?')) deleteEntryAdmin(btn.getAttribute('data-delbtn'));
    });
  });
  container.querySelectorAll('[data-save]').forEach(btn=>{
    btn.addEventListener('click', saveEditEntry);
  });
  container.querySelectorAll('[data-cancel]').forEach(btn=>{
    btn.addEventListener('click', cancelEditEntry);
  });
  container.querySelectorAll('.edit-form').forEach(form=>{
    form.querySelector('.edit-jurusan').addEventListener('change', e=> updateEditForm('jurusan', e.target.value));
    form.querySelector('.edit-tanggal').addEventListener('change', e=> updateEditForm('tanggal', e.target.value));
    form.querySelector('.edit-kotor').addEventListener('input', e=> updateEditForm('kotor', e.target.value));
    form.querySelector('.edit-untung').addEventListener('input', e=> updateEditForm('untung', e.target.value));
  });
}

/* ============ INIT ============ */
loadAll();
</script>
</body>
</html>
